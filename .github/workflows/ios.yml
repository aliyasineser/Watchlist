name: iOS checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      WATCHLIST_RESULTS_DIR: ${{ runner.temp }}/watchlist-results
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swiftlint version
      - name: Lint app sources
        run: swiftlint lint --strict --no-cache Watchlist
      - name: Build and run unit and UI tests with coverage
        run: Scripts/test.sh
      - name: Upload test results, coverage and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/watchlist-results
          if-no-files-found: warn
